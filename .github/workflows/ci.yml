name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  schema-validate:
    name: schema-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx jest

      - name: Validate any new schema snapshots
        run: |
          for f in src/shared/provider-schemas/*.json; do
            version=$(basename "$f" .json)
            echo "Validating $version..."
            node scripts/validate-schema.js "$version"
          done

      - name: TypeScript compile check
        run: npx tsc --noEmit
